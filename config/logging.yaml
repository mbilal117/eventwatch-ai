version: 1
disable_existing_loggers: False

formatters:
  standard:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  json:
    class: structlog.stdlib.JSONRenderer

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: standard
    stream: ext://sys.stdout
  
  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: logs/eventwatch.log
    maxBytes: 10485760  # 10MB
    backupCount: 5

loggers:
  app:
    level: INFO
    handlers: [console, file]
    propagate: False
  
  sqlalchemy:
    level: WARNING
    handlers: [console]
    propagate: False
  
  uvicorn:
    level: INFO
    handlers: [console]
    propagate: False

root:
  level: INFO
  handlers: [console, file]
