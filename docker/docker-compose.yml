version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: eventwatch-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=eventwatch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    container_name: eventwatch-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/eventwatch
    volumes:
      - ../logs:/app/logs

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dashboard
    container_name: eventwatch-dashboard
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://api:8001

volumes:
  postgres_data:
